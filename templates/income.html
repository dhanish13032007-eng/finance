<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your income records in FinanceFlow">
    <title>Income — FinanceFlow</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h2>💎 FinanceFlow</h2>
                <span>Finance Manager</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="/income" class="nav-item active">
                    <span class="icon">💰</span> Income
                </a>
                <a href="/expenses" class="nav-item">
                    <span class="icon">💸</span> Expenses
                </a>
                <a href="/profile" class="nav-item">
                    <span class="icon">👤</span> Profile
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" onclick="logout()">
                    <span class="icon">🚪</span> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div style="display:flex;align-items:center;gap:1rem;">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                    <h1>Income Management</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline" onclick="exportIncomeCSV()">📄 Export CSV</button>
                    <button class="btn btn-sm btn-primary" onclick="openAddModal()">+ Add Income</button>
                </div>
            </header>

            <div class="page-body">
                <!-- Summary -->
                <div class="stats-grid">
                    <div class="stat-card income">
                        <div class="stat-icon">💰</div>
                        <div class="stat-label">Total Income</div>
                        <div class="stat-value text-green" id="totalIncome">₹0</div>
                    </div>
                    <div class="stat-card savings">
                        <div class="stat-icon">📊</div>
                        <div class="stat-label">Records</div>
                        <div class="stat-value text-purple" id="totalRecords">0</div>
                    </div>
                </div>

                <!-- Income Table -->
                <div class="data-card">
                    <div class="card-header">
                        <h3>All Income Records</h3>
                    </div>
                    <div class="data-table-wrapper">
                        <table class="data-table" id="incomeTable">
                            <thead>
                                <tr>
                                    <th>Source</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="incomeBody">
                                <tr><td colspan="5"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Income Modal -->
    <div class="modal-overlay" id="incomeModal">
        <div class="modal">
            <h2 id="modalTitle">Add Income</h2>
            <form id="incomeForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="source">Income Source</label>
                    <input type="text" id="source" placeholder="e.g. Salary, Freelance, Rent" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" rows="2" placeholder="Short note..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Income</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/income.js"></script>
</body>
</html>
