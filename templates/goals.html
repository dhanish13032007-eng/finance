<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Goals — FinanceFlow</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .goal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            transition: var(--transition);
        }

        .goal-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-md); }

        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .goal-title { font-weight: 700; font-size: 1.1rem; }
        .goal-deadline { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
        
        .goal-amounts { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.4rem; }
        .goal-amounts strong { color: var(--text-primary); }

        .progress-bar { height: 8px; background: var(--bg-input); border-radius: 999px; overflow: hidden; margin-bottom: 1rem; }
        .progress-fill { height: 100%; border-radius: 999px; transition: width 0.8s ease; }

        .goal-actions { display: flex; gap: 0.5rem; }
        .goal-actions button { flex: 1; padding: 0.4rem; font-size: 0.8rem; border-radius: var(--radius-sm); border: none; cursor: pointer; }
        .btn-add { background: rgba(0, 184, 148, 0.1); color: var(--accent-green); }
        .btn-add:hover { background: rgba(0, 184, 148, 0.2); }
        .btn-del { background: rgba(225, 112, 85, 0.1); color: var(--accent-red); }
        .btn-del:hover { background: rgba(225, 112, 85, 0.2); }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 14, 23, 0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 90%; max-width: 400px; padding: 2rem; animation: fadeSlideUp 0.3s ease; }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>💎 FinanceFlow</h2>
            <span>Financial Intelligence</span>
        </div>
        <nav class="sidebar-nav">
             <a href="/dashboard" class="nav-item">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="/accounts" class="nav-item">
                <span class="icon">🏦</span> Accounts
            </a>
            <a href="/goals" class="nav-item active">
                <span class="icon">🎯</span> Goals
            </a>
            <a href="/income" class="nav-item">
                <span class="icon">💰</span> Income
            </a>
            <a href="/expenses" class="nav-item">
                <span class="icon">💸</span> Expenses
            </a>
             <a href="/scan" class="nav-item">
                <span class="icon">📸</span> Scan Receipt
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Savings Goals</h1>
                <p style="color:var(--text-muted);font-size:0.85rem;">Track and visualize your path to financial targets.</p>
            </div>
            <button class="btn btn-primary" onclick="openGoalModal()">+ New Goal</button>
        </header>

        <section class="page-body">
            <div id="goalsGrid" class="goals-grid">
                <!-- Reactively populated via JS -->
            </div>
        </section>
    </main>
</div>

<!-- Add Goal Modal -->
<div class="modal" id="goalModal">
    <div class="modal-content">
        <h2 style="margin-bottom:1.5rem;font-size:1.25rem;">Create Savings Goal</h2>
        <form id="goalForm">
            <div class="form-group">
                <label>Goal Name (e.g., Emergency Fund)</label>
                <input type="text" id="gName" required>
            </div>
            <div class="form-group">
                <label>Target Amount (₹)</label>
                <input type="number" id="gTarget" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Deadline (Optional)</label>
                <input type="date" id="gDeadline">
            </div>
            <div style="display:flex;gap:1rem;margin-top:2rem;">
                <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeGoalModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex:1;">Create Goal</button>
            </div>
        </form>
    </div>
</div>

<!-- Add Funds Modal -->
<div class="modal" id="fundModal">
    <div class="modal-content">
        <h2 style="margin-bottom:1.5rem;font-size:1.25rem;">Add Funds to Goal</h2>
        <form id="fundForm">
            <input type="hidden" id="fundGoalId">
            <div class="form-group">
                <label>Amount to Add (₹)</label>
                <input type="number" id="fAmount" step="0.01" required>
            </div>
            <div style="display:flex;gap:1rem;margin-top:2rem;">
                <button type="button" class="btn btn-secondary" style="flex:1;" onclick="closeFundModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex:1;">Add Funds</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/goals.js"></script>
</body>
</html>
